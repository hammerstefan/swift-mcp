[project]
name = "swift-read-only-mcp"
version = "0.1.0"
description = "Authenticated, bounded, read-only MCP view of OpenStack Swift"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==4.1.3",
  "generateapikey==0.6.0",
  "httpx==0.28.1",
  "mcp>=2,<3",
  "python-keystoneclient==6.0.0",
  "requests>=2,<3",
  "SecretStorage==3.5.0",
  "uvicorn==0.54.0",
]

[project.scripts]
swift-read-only-mcp = "swift_read_only_mcp.__main__:main"
swift-mcp-keys = "swift_read_only_mcp.key_management:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swift_read_only_mcp"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
    "ruff==0.17.5",
    "ty==0.0.105",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
